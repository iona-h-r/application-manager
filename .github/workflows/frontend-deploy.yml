name: Frontend Deploy

on:
  push:
    branches:
      - prd
    paths:
      - frontend/**
      - .github/workflows/frontend-deploy.yml
  workflow_run:
    workflows:
      - Terraform Apply
    types:
      - completed
      
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TF_VAR_aws_region: ap-northeast-1
  TF_VAR_app_name: application-manager
  TF_VAR_environment: prod
  TF_VAR_ses_from_address: ${{ secrets.SES_FROM_ADDRESS }}
  TF_VAR_ses_admin_address: ${{ secrets.SES_ADMIN_ADDRESS }}
  TF_VAR_frontend_domain_name: "" # カスタムドメインを利用する場合に指定。指定なければデフォルトドメイン
  TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment: prd
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Read Terraform Outputs
        id: tf
        working-directory: terraform
        run: |
          terraform init -input=false
          OUTPUT_JSON=$(terraform output -json)
          echo "api_base_url=$(echo "$OUTPUT_JSON" | jq -r '.api_base_url.value')" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(echo "$OUTPUT_JSON" | jq -r '.cognito_user_pool_id.value')" >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$(echo "$OUTPUT_JSON" | jq -r '.cognito_user_pool_client_id.value')" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(echo "$OUTPUT_JSON" | jq -r '.frontend_bucket_name.value')" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(echo "$OUTPUT_JSON" | jq -r '.cloudfront_distribution_id.value')" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.tf.outputs.api_base_url }}
          VITE_USER_POOL_ID: ${{ steps.tf.outputs.user_pool_id }}
          VITE_USER_POOL_CLIENT_ID: ${{ steps.tf.outputs.user_pool_client_id }}
          VITE_COGNITO_REGION: ${{ env.AWS_REGION }}
        run: npm run build

      - name: Upload to S3
        working-directory: frontend
        run: aws s3 sync dist s3://${{ steps.tf.outputs.frontend_bucket }} --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.tf.outputs.distribution_id }} --paths "/*"
