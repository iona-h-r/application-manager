name: API Docs Deploy

on:
  workflow_run:
    workflows:
      - Terraform Apply
    types:
      - completed

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy-docs:
    if: github.event.workflow_run.conclusion == 'success'
    environment: prd
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Terraform から API Gateway ID とベース URL を取得 ──────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Read Terraform Outputs
        id: tf
        working-directory: terraform
        run: |
          terraform init -input=false
          OUTPUT_JSON=$(terraform output -json)
          echo "api_id=$(echo "$OUTPUT_JSON"       | jq -r '.api_gateway_id.value')" >> "$GITHUB_OUTPUT"
          echo "api_base_url=$(echo "$OUTPUT_JSON" | jq -r '.api_base_url.value')"  >> "$GITHUB_OUTPUT"

      # ── AWS から OpenAPI 定義をエクスポート ─────────────────────────
      - name: Export OpenAPI from API Gateway
        run: |
          aws apigatewayv2 export-api \
            --api-id "${{ steps.tf.outputs.api_id }}" \
            --output-type YAML \
            --specification OAS30 \
            --no-include-extensions \
            openapi-exported.yaml

      # ── overlay とマージ ────────────────────────────────────────────
      - name: Merge OpenAPI with overlay
        run: |
          pip install pyyaml --quiet
          python3 scripts/merge_openapi.py \
            openapi-exported.yaml \
            docs/openapi-overlay.yaml \
            openapi-merged.yaml

      # ── Redoc で静的 HTML をビルド ───────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build Redoc HTML
        run: |
          mkdir -p docs/dist
          cp openapi-merged.yaml docs/dist/openapi.yaml
          npx --yes @redocly/cli build-docs openapi-merged.yaml \
            --output docs/dist/index.html \
            --title "Application Manager API Docs"

      # ── gh-pages ブランチへデプロイ ──────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/dist
          commit_message: "docs: update API docs [${{ github.sha }}]"
